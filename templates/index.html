<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="USMEF Korea 주간 해외 동향 Excel 보고서 생성 도구">
  <title>주간 해외 동향 리포트</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <main class="page-shell">
    <section class="report-card" aria-labelledby="page-title">
      <p class="eyebrow">U.S. MEAT EXPORT FEDERATION</p>
      <h1 id="page-title">주간 해외 동향 리포트</h1>
      <p class="description">
        엑셀 양식의 빈 주차 행에 USMEF Korea 뉴스라인의 미국 소고기 도축두수와 컷아웃 가격을 채웁니다.
      </p>

      <div class="report-details" aria-label="보고서 구성">
        <div>
          <span class="detail-label">데이터 원본</span>
          <strong>USMEF Korea 뉴스라인 · 기존 엑셀 양식</strong>
        </div>
        <div>
          <span class="detail-label">파일 형식</span>
          <strong>Excel (.xlsx)</strong>
        </div>
        <div>
          <span class="detail-label">포함 항목</span>
          <strong>도축두수 · USDA 수정 · 컷아웃 가격</strong>
        </div>
      </div>

      <form id="report-form" action="{{ url_for('generate_report') }}" method="post">
        <button id="generate-button" type="submit">
          <span class="button-label">보고서 생성 및 다운로드</span>
          <span class="button-loading" aria-hidden="true">뉴스라인을 분석하고 있습니다…</span>
        </button>
      </form>
      <p id="status-message" class="status-message" aria-live="polite">
        금요일 주차 행에는 다음 주 수요일 뉴스 데이터를 반영합니다.
      </p>
    </section>
  </main>

  <script>
    const form = document.getElementById("report-form");
    const button = document.getElementById("generate-button");
    const status = document.getElementById("status-message");

    form.addEventListener("submit", () => {
      button.disabled = true;
      button.classList.add("is-loading");
      status.textContent = "양식의 비어 있는 주차 행을 현행화하고 있습니다.";
    });
  </script>
</body>
</html>
