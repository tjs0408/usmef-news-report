{# Shared, local vector artwork: no external fonts, emoji or image requests. #}
{% macro avatar(animal, country, graph=false) -%}
<span class="sheet-avatar animal-{{ animal }}{% if graph %} is-graph{% endif %}" data-animal="{{ animal }}" data-country="{{ country }}" aria-hidden="true">
  {% if graph %}
    <svg class="sheet-chart" viewBox="0 0 64 64" focusable="false"><use href="#scope-chart"></use></svg>
  {% else %}
    <svg class="sheet-animal" viewBox="0 0 64 64" focusable="false"><use href="#scope-animal-{{ animal }}"></use></svg>
  {% endif %}
  <span class="sheet-flags{% if country == 'eu-de' %} has-region{% endif %}">
    {% if country == 'eu-de' %}<svg class="sheet-flag region-flag" viewBox="0 0 36 24" focusable="false"><use href="#scope-flag-eu"></use></svg>{% endif %}
    <svg class="sheet-flag" viewBox="0 0 36 24" focusable="false"><use href="#scope-flag-{{ 'de' if country == 'eu-de' else country }}"></use></svg>
  </span>
</span>
{%- endmacro %}
